[sheet_detection]
# DPS：檔名含 DPS 後，依活頁簿順序抓第一張名稱含下列關鍵字的 sheet。
dps_sheet_keywords = DPS

# PP：檔名含 PP 後，依活頁簿順序抓第一張名稱含下列關鍵字且有樞紐分析表的 sheet。
# 多個關鍵字可用逗號分隔，例如：PP, Data, Pivot
pp_sheet_keywords = PP, Data

[dps]
# DPS 料號欄表頭可接受的名稱；程式會依序使用第一個存在的欄位。
part_number_headers = AVTC P/N, P/N, Model

[pp]
# PP 樞紐快取內的料號欄關鍵字；若同時有多個 Part Number 欄，程式會優先選含 FG 的欄位。
part_number_field_keywords = Part Number

[customers]
# 程式會依序檢查 input/AVTC、input/RAKEN；有放 Excel 的資料夾才會處理。
names = AVTC, RAKEN

[customer.AVTC]
# AVTC 維持原本邏輯：DPS/PP 都取第一份格式正確的來源檔。
dps_mode = first_valid
pp_mode = first_valid
# AVTC DPS 保留日期數量全為 0 的料號列。
dps_drop_zero_total_rows = false
# AVTC DPS 保留尾端日期數量全為 0 的日期欄。
dps_trim_trailing_zero_dates = false
# DPS+PP：DPS 保留含目前 buyer week 共 5 週；例如目前 WK34，DPS 到 WK38，PP 從 WK39 開始。
dps_pp_dps_weeks_ahead = 5
# DPS+PP：DPS 截止日之後仍有數字時，併入 DPS 保留週最後一天。
dps_pp_late_dps_mode = merge_to_cutoff

[customer.RAKEN]
# RAKEN DPS 會合併資料夾內所有格式正確的 DPS 檔，同料號同日期累加。
# RAKEN PP 維持原本邏輯：取第一份格式正確的 PP 檔。
dps_mode = merge_all
pp_mode = first_valid
# RAKEN DPS 來源尾端常有備註/簽核列；若日期數量全為 0，預設略過。
dps_drop_zero_total_rows = true
# RAKEN DPS 只列到最後一個有數量的日期，尾端全空日期欄預設略過。
dps_trim_trailing_zero_dates = true
# DPS+PP：DPS 保留含目前 buyer week 共 2 週；例如目前 WK35，DPS 到 WK36，PP 從 WK37 開始。
# Windows exe 雙擊執行時，若 input/RAKEN 有 Excel，會先跳出視窗讓使用者選擇 2 / 3 / 4 週。
dps_pp_dps_weeks_ahead = 2
# DPS+PP：RAKEN 截止日後的 DPS 不併回最後一天，避免與 PP 接續週重複。
dps_pp_late_dps_mode = drop
